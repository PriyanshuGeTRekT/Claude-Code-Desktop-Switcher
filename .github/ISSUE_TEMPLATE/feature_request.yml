name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: Describe the situation you are in, rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Optional. If you already have an approach in mind, describe it here.

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you be willing to work on this?
      options:
        - label: I would be happy to open a pull request for it
